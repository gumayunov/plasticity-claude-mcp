<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">Установка за 2 минуты — Видео скоро</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1320"/><stop offset=".55" stop-color="#10233a"/><stop offset="1" stop-color="#1a1840"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42d8c0"/><stop offset="1" stop-color="#85b9ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#42d8c0" stop-opacity=".30"/><stop offset="1" stop-color="#42d8c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3a5470" stroke-opacity=".22"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1320" stop-opacity="1"/><stop offset=".7" stop-color="#0a1320" stop-opacity=".35"/><stop offset="1" stop-color="#0a1320" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <rect width="960" height="540" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="538" rx="23" fill="none" stroke="#4b6678" stroke-opacity=".5"/>
  
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" opacity=".55">
    <rect x="500" y="90" width="400" height="300" rx="14" fill="#0d1b2b" stroke="#2f4a63"/>
    <text x="528" y="140" fill="#7fe9d6">$ git clone …/plasticity-claude-mcp</text>
    <text x="528" y="176" fill="#7fe9d6">$ npm install</text>
    <text x="528" y="212" fill="#7fe9d6">$ npm run start:plasticity</text>
    <text x="528" y="248" fill="#7fe9d6">$ npm run setup:claude</text>
    <text x="528" y="284" fill="#a9bfcf">✓ plasticity connected</text>
  </g>
  <circle cx="200" cy="200" r="64" fill="url(#accent)"/>
  <path d="M182 168 L238 200 L182 232 Z" fill="#0a1320"/>
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', 'Noto Sans JP', 'Microsoft YaHei', sans-serif">
    <text x="64" y="340" font-size="34" font-weight="800" fill="#f2f8fc">Установка за 2 минуты</text>
    <text x="64" y="380" font-size="19" fill="#a9bfcf">Установка, подключение Plasticity, первая деталь</text>
    <rect x="64" y="430" width="123" height="30" rx="15" fill="#42d8c0" fill-opacity=".16" stroke="#42d8c0"/>
    <text x="125.5" y="450" font-size="15" font-weight="600" fill="#42d8c0" text-anchor="middle">Видео скоро</text>
  </g>
</svg>
